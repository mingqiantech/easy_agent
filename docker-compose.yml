version: "3.8"

services:
  agent:
    build: .
    ports:
      - "4096:4096"
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4096
      - EASY_AGENT_STATE_DIR=/app/data
    working_dir: /app/workspace
    restart: unless-stopped
